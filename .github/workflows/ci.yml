name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt pytest ruff

      - name: Ruff
        run: ruff check --select F,E9,B,UP,SIM --target-version py312 .

      - name: Pytest (hermetic - only talks to an in-process stub on 127.0.0.1)
        run: python -m pytest tests/ -q
